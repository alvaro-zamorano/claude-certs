<title>{{t.cards_title}}</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>
:root{
  --bg:#f7f6f3; --surface:#fffefb; --surface-2:#f0eee8; --line:#e0ddd4; --line-strong:#c9c5b8;
  --ink:#20201d; --ink-2:#57544c; --ink-3:#8b8779;
  --accent:#b5541f; --accent-soft:#f6e8de; --accent-ink:#8c3f16;
  --ok:#2f6b46; --ok-soft:#e2efe7; --bad:#a32f28; --bad-soft:#f8e5e3;
  --mono:ui-monospace,SFMono-Regular,"SF Mono",Menlo,monospace;
  --sans:ui-sans-serif,-apple-system,"Segoe UI",Inter,Helvetica,Arial,sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#16161a; --surface:#1e1e23; --surface-2:#26262c; --line:#33333b; --line-strong:#4a4a55;
  --ink:#eceae4; --ink-2:#a8a49b; --ink-3:#7b776e;
  --accent:#e0834c; --accent-soft:#3a2617; --accent-ink:#f0a274;
  --ok:#6dbb8e; --ok-soft:#1c2f24; --bad:#e0817a; --bad-soft:#33201e;
}}
:root[data-theme="dark"]{
  --bg:#16161a; --surface:#1e1e23; --surface-2:#26262c; --line:#33333b; --line-strong:#4a4a55;
  --ink:#eceae4; --ink-2:#a8a49b; --ink-3:#7b776e;
  --accent:#e0834c; --accent-soft:#3a2617; --accent-ink:#f0a274;
  --ok:#6dbb8e; --ok-soft:#1c2f24; --bad:#e0817a; --bad-soft:#33201e;
}
*{box-sizing:border-box}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.55;-webkit-font-smoothing:antialiased;
     overscroll-behavior:none;-webkit-tap-highlight-color:transparent}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
code{font-family:var(--mono);font-size:var(--t-dato);background:var(--surface-2);padding:1px 5px;border-radius:4px;border:1px solid var(--line)}
.app{max-width:620px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}

/* Cabecera */
.top{display:flex;align-items:center;gap:12px;padding:calc(14px + env(safe-area-inset-top)) 18px 14px;border-bottom:1px solid var(--line)}
.top h1{font-size:var(--t-base);margin:0;letter-spacing:-.01em;flex:1}
.top a,.back{font-size:var(--t-menor);color:var(--accent-ink);text-decoration:none;font-weight:520}
.streak{font-size:var(--t-micro);color:var(--ink-3);font-family:var(--mono);white-space:nowrap}

/* Home */
.home{padding:20px 18px calc(28px + env(safe-area-inset-bottom))}
.hero{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:20px;margin-bottom:22px}
.hero .n{font-size:var(--t-cifra);font-weight:650;letter-spacing:-.03em;line-height:1}
.hero .lbl{font-size:var(--t-micro);text-transform:uppercase;letter-spacing:.1em;color:var(--ink-3);margin-bottom:7px}
.hero p{margin:9px 0 16px;font-size:var(--t-dato);color:var(--ink-2)}
.cta{display:block;width:100%;background:var(--accent);color:#fff;padding:15px;border-radius:10px;font-size:max(16px,.95rem);font-weight:560;text-align:center}
.cta.ghost{background:var(--surface-2);color:var(--ink);border:1px solid var(--line-strong);margin-top:9px;font-weight:500}
.cta:disabled{opacity:.45}
h2.sec{font-size:var(--t-micro);text-transform:uppercase;letter-spacing:.11em;color:var(--ink-3);margin:0 0 11px;font-weight:600}
.tema{display:flex;align-items:center;gap:13px;width:100%;text-align:left;background:var(--surface);border:1px solid var(--line);
      border-radius:11px;padding:13px 15px;margin-bottom:8px;transition:.13s}
.tema:active{transform:scale(.985)}
.tema .nm{flex:1;min-width:0}
.tema .t1{font-size:var(--t-dato);font-weight:520;margin-bottom:6px}
.tema .track{height:5px;background:var(--surface-2);border-radius:99px;overflow:hidden}
.tema .fill{height:100%;background:var(--accent);border-radius:99px;transition:width .5s}
.tema .fill.done{background:var(--ok)}
.tema .pc{font-family:var(--mono);font-size:var(--t-micro);color:var(--ink-3);white-space:nowrap}
.tema .due{background:var(--accent-soft);color:var(--accent-ink);font-size:var(--t-micro);font-weight:600;padding:2px 7px;border-radius:99px;white-space:nowrap}

/* Sesión */
.sesion{flex:1;display:none;flex-direction:column;min-height:100%}
.sesion.on{display:flex}
.home.off,.top.off{display:none}
.pbar{display:flex;gap:3px;padding:12px 18px calc(12px + env(safe-area-inset-top)) }
.pdot{flex:1;height:4px;background:var(--surface-2);border-radius:99px;transition:.3s}
.pdot.ok{background:var(--ok)} .pdot.no{background:var(--bad)} .pdot.now{background:var(--ink-3)}
.shead{display:flex;align-items:center;gap:10px;padding:0 18px 10px}
.shead .tema-lbl{font-size:var(--t-micro);text-transform:uppercase;letter-spacing:.1em;color:var(--ink-3);flex:1}
.lvl{font-size:var(--t-micro);font-weight:600;padding:2px 8px;border-radius:99px;background:var(--surface-2);color:var(--ink-3);white-space:nowrap}
.lvl.l1{background:var(--accent-soft);color:var(--accent-ink)}
.lvl.l2{background:var(--ok-soft);color:var(--ok)}
.stage{flex:1;display:flex;align-items:center;justify-content:center;padding:6px 18px 18px;overflow-y:auto;-webkit-overflow-scrolling:touch}
.card{width:100%;background:var(--surface);border:1px solid var(--line);border-radius:16px;padding:26px 22px;
      box-shadow:0 3px 18px rgba(0,0,0,.06);min-height:240px;display:flex;flex-direction:column;justify-content:center;
      transition:transform .18s ease, opacity .18s ease}
.card.out-l{transform:translateX(-120%) rotate(-7deg);opacity:0}
.card.out-r{transform:translateX(120%) rotate(7deg);opacity:0}
.q{font-size:var(--t-sub);line-height:1.45;font-weight:560;letter-spacing:-.01em}
.a{margin-top:17px;padding-top:16px;border-top:1px solid var(--line);font-size:var(--t-base);line-height:1.6;color:var(--ink-2)}
.a b{color:var(--ink)}
.hint{margin-top:20px;font-size:var(--t-micro);color:var(--ink-3);text-align:center}
.acts{display:flex;gap:10px;padding:12px 18px calc(16px + env(safe-area-inset-bottom));border-top:1px solid var(--line);background:var(--surface)}
.acts button{flex:1;padding:16px 10px;border-radius:11px;font-size:max(16px,.93rem);font-weight:550}
.acts .no{background:var(--bad-soft);color:var(--bad)}
.acts .yes{background:var(--ok-soft);color:var(--ok)}
.acts .show{background:var(--accent);color:#fff}
.quit{position:absolute;right:14px;top:calc(8px + env(safe-area-inset-top));font-size:var(--t-sub);color:var(--ink-3);padding:6px 8px;line-height:1}
.wrapRel{position:relative}

/* Resumen */
.fin{padding:26px 18px calc(28px + env(safe-area-inset-bottom));text-align:center}
.fin .big{font-size:var(--t-cifra);font-weight:650;letter-spacing:-.03em;margin-bottom:4px}
.fin p{color:var(--ink-2);font-size:var(--t-dato);margin:0 0 20px}
.stats{display:flex;gap:9px;margin-bottom:22px}
.stat{flex:1;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:13px 8px}
.stat .v{font-size:var(--t-sub);font-weight:620;line-height:1.1}
.stat .k{font-size:var(--t-micro);text-transform:uppercase;letter-spacing:.08em;color:var(--ink-3);margin-top:3px}
.subir{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:14px 15px;margin-bottom:18px;font-size:var(--t-dato);color:var(--ink-2)}
.subir b{color:var(--ink);display:block;margin-bottom:6px;font-size:var(--t-micro);text-transform:uppercase;letter-spacing:.09em}
.subir li{margin-bottom:5px}
.err{padding:40px 20px;text-align:center;color:var(--ink-2);font-size:var(--t-dato)}
</style>

<div class="app wrapRel">
  <div class="top" id="top">
    <h1>{{t.cards_title}}</h1>
    <span class="streak" id="streak"></span>
    <a href="../architect/">{{t.nav_architect}}</a>
    <a href="../developer/">{{t.nav_developer}}</a>
    <a href="../referencia/">{{t.nav_reference}}</a>
    <a href="../apuntes/">{{t.nav_notes}}</a>
    <a href="../">{{t.nav_test}}</a>
  </div>

  <div class="home" id="home" aria-busy="true"><div class="err">{{t.loading}}</div></div>

  <div class="sesion" id="sesion">
    <button class="quit" id="quit" aria-label="{{t.quit}}">✕</button>
    <div class="pbar" id="pbar"></div>
    <div class="shead"><span class="tema-lbl" id="temaLbl"></span><span class="lvl" id="lvlLbl"></span></div>
    <div class="stage" role="region" aria-live="polite" aria-label="{{t.aria_card}}"><div class="card" id="card"></div></div>
    <div class="acts" id="acts"></div>
  </div>
</div>

<script>
const KEY="claude-certs-cards-v2";
const GAP=[0,1,3,7,21];                     // días por nivel
const NIV=[T.lv0,T.lv1,T.lv2,T.lv3,T.lv3];
const TANDA=10;

let ST={}; try{ST=JSON.parse(localStorage.getItem(KEY)||"{}")}catch(e){}
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(ST))}catch(e){}};
const el=id=>document.getElementById(id);
const rec=id=>ST[id]||(ST[id]={box:0,seen:0,due:0});
const isDue=c=>{const r=ST[c.id];return c.x!==false&&(!r||!r.due||r.due<=Date.now())};
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};

let CARDS=[], TEMAS=[], FUERA=[], deck=[], i=0, shown=false, res=[], subieron=[];

fetch("../cards.json").then(r=>r.json()).then(d=>{
  CARDS=d.cards; TEMAS=d.temas; FUERA=d.fuera||[];
  el("home").removeAttribute("aria-busy"); home();
}).catch(()=>{
  el("home").innerHTML='<div class="err">'+T.deck_fail+'</div>';
});

/* ---------- Racha ---------- */
function racha(){
  const hoy=new Date().toISOString().slice(0,10);
  const m=ST.__meta||(ST.__meta={dias:[],racha:0});
  return {hoy,m};
}
function marcaDia(){
  const {hoy,m}=racha();
  if(m.dias[m.dias.length-1]===hoy) return;
  const ayer=new Date(Date.now()-86400000).toISOString().slice(0,10);
  m.racha = m.dias[m.dias.length-1]===ayer ? (m.racha||0)+1 : 1;
  m.dias.push(hoy); if(m.dias.length>60)m.dias.shift();
  save();
}

/* ---------- Home ---------- */
function dominio(cs){
  if(!cs.length) return 0;
  const s=cs.reduce((a,c)=>a+Math.min(3,(ST[c.id]||{}).box||0),0);
  return Math.round(s/(cs.length*3)*100);
}
function home(){
  el("sesion").classList.remove("on"); el("home").classList.remove("off"); el("top").classList.remove("off");
  const due=CARDS.filter(isDue);
  const m=(ST.__meta||{});
  el("streak").textContent=m.racha?(T.streak+" "+m.racha+"d"):"";
  const total=dominio(CARDS.filter(c=>c.x!==false));
  el("home").innerHTML=`
    <div class="hero">
      <div class="lbl">${T.due_label}</div>
      <div class="n">${due.length}</div>
      <p>${due.length? T.batch_is+" "+Math.min(TANDA,due.length)+" "+T.batch_is2 : T.nothing_due}</p>
      <button class="cta" id="go" ${due.length?"":"disabled"}>${T.start_batch}</button>
      <button class="cta ghost" id="goAll">${T.free_batch}</button>
      <div style="margin-top:14px;font-size:var(--t-micro);color:var(--ink-3)">${T.global_mastery} <b style="color:var(--ink)">${total}%</b> · ${CARDS.filter(c=>c.x!==false).length} ${T.cards_lc}</div>
    </div>
    <h2 class="sec">${T.by_topic}</h2>
    ${listaTemas(TEMAS)}
    ${FUERA.length?`<details class="cc-fuera"><summary>${T.fuera_t} · ${FUERA.length}</summary>
       <p class="nota">${T.fuera_d}</p>${listaTemas(FUERA)}</details>`:""}`;
  cablea();
}
function listaTemas(lista){
  return lista.map(t=>{
      const cs=CARDS.filter(c=>c.t===t), d=cs.filter(isDue).length, pc=dominio(cs);
      return `<button class="tema" data-t="${t.replace(/"/g,'&quot;')}">
        <div class="nm"><div class="t1">${t}</div><div class="track"><div class="fill ${pc>=85?'done':''}" style="width:${pc}%"></div></div></div>
        ${d?`<span class="due">${d}</span>`:''}<span class="pc">${pc}%</span></button>`;
  }).join("");
}
function cablea(){
  el("go").onclick=()=>start(shuffle(CARDS.filter(isDue)).slice(0,TANDA),T.todays_review);
  el("goAll").onclick=()=>start(shuffle(CARDS.filter(c=>c.x!==false)).slice(0,TANDA),T.free_label);
  document.querySelectorAll(".tema").forEach(b=>b.onclick=()=>{
    const t=b.dataset.t, cs=CARDS.filter(c=>c.t===t);
    const orden=[...cs.filter(isDue),...cs.filter(c=>!isDue(c))];
    start(orden.slice(0,TANDA),t);
  });
}

/* ---------- Sesión ---------- */
function start(cs,titulo){
  if(!cs.length)return;
  deck=cs; i=0; res=[]; subieron=[];
  el("home").classList.add("off"); el("top").classList.add("off"); el("sesion").classList.add("on");
  el("temaLbl").dataset.base=titulo;
  draw();
}
function draw(){
  if(i>=deck.length) return fin();
  const c=deck[i], r=ST[c.id]||{box:0};
  shown=false;
  el("pbar").innerHTML=deck.map((_,k)=>`<span class="pdot ${res[k]===1?'ok':res[k]===0?'no':k===i?'now':''}"></span>`).join("");
  el("temaLbl").textContent=el("temaLbl").dataset.base+" · "+(i+1)+" "+T.of+" "+deck.length;
  const lv=Math.min(3,r.box||0);
  el("lvlLbl").textContent=NIV[lv]; el("lvlLbl").className="lvl"+(lv===0?"":lv<3?" l1":" l2");
  const card=el("card");
  card.className="card"; card.innerHTML=`<div class="q">${c.f}</div><div id="ans"></div><div class="hint" id="hint">${T.tap_card}</div>`;
  card.onclick=reveal;
  el("acts").innerHTML=`<button class="show" id="bShow">${T.show_answer}</button>`;
  el("bShow").onclick=reveal;
}
function reveal(){
  if(shown)return; shown=true;
  el("ans").innerHTML=`<div class="a">${deck[i].b}</div>`;
  const h=el("hint"); if(h)h.remove();
  el("acts").innerHTML=`<button class="no" id="bNo">${T.missed}</button><button class="yes" id="bYes">${T.knew}</button>`;
  el("bNo").onclick=()=>grade(0); el("bYes").onclick=()=>grade(1);
}
function grade(ok){
  const c=deck[i], r=rec(c.id), antes=Math.min(3,r.box||0);
  r.seen++; r.box=ok?Math.min(4,(r.box||0)+1):0;
  r.due=Date.now()+GAP[r.box]*86400000;
  const ahora=Math.min(3,r.box);
  if(ok&&ahora>antes) subieron.push({t:c.t,n:NIV[ahora]});
  res[i]=ok; save();
  const card=el("card"); card.classList.add(ok?"out-r":"out-l");
  setTimeout(()=>{ i++; draw(); },170);
}
function fin(){
  marcaDia();
  const aciertos=res.filter(x=>x===1).length, m=ST.__meta||{};
  const falladas=deck.filter((c,k)=>res[k]===0);
  el("pbar").innerHTML=""; el("temaLbl").textContent=""; el("lvlLbl").textContent=""; el("acts").innerHTML="";
  el("card").outerHTML=`<div class="fin" id="finBox"></div>`;
  el("finBox").innerHTML=`
    <div class="big">${aciertos}/${deck.length}</div>
    <p>${aciertos===deck.length?T.perfect:aciertos>=deck.length*0.7?T.good_pace:T.another_pass}</p>
    <div class="stats">
      <div class="stat"><div class="v">${subieron.length}</div><div class="k">${T.leveled_up}</div></div>
      <div class="stat"><div class="v">${falladas.length}</div><div class="k">${T.back_tomorrow}</div></div>
      <div class="stat"><div class="v">${m.racha||1}</div><div class="k">${T.streak_days}</div></div>
    </div>
    ${falladas.length?`<div class="subir"><b>${T.review_tonight}</b><ul>${falladas.slice(0,5).map(c=>`<li>${c.f}</li>`).join("")}</ul></div>`:""}
    <button class="cta" id="otra">${T.another_batch}</button>
    <button class="cta ghost" id="volver">${T.back_index}</button>`;
  el("otra").onclick=()=>{restore();const due=CARDS.filter(isDue);start(shuffle(due.length?due:CARDS.filter(c=>c.x!==false)).slice(0,TANDA),due.length?T.todays_review:T.free_label)};
  el("volver").onclick=()=>{restore();home()};
}
function restore(){
  const box=el("finBox"); if(box) box.outerHTML=`<div class="card" id="card"></div>`;
}
el("quit").onclick=()=>{restore();home()};
document.addEventListener("keydown",e=>{
  if(!el("sesion").classList.contains("on"))return;
  if(e.key===" "){e.preventDefault();reveal()}
  else if(e.key==="1"&&shown)grade(0);
  else if(e.key==="2"&&shown)grade(1);
  else if(e.key==="Escape"){restore();home()}
});
/* Swipe: izquierda = no me salía, derecha = la sabía */
let x0=null;
document.addEventListener("touchstart",e=>{if(shown&&el("sesion").classList.contains("on"))x0=e.touches[0].clientX},{passive:true});
document.addEventListener("touchend",e=>{
  if(x0===null||!shown)return;
  const dx=e.changedTouches[0].clientX-x0; x0=null;
  if(Math.abs(dx)>75) grade(dx>0?1:0);
},{passive:true});
</script>
